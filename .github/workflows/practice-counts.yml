name: Practice counts

# Writes contributors/<handle>/.practice.json from merged pull requests and closed stage
# issues (nest practice-counts, from py/), then commits to main. The site build reads these files and never calls GitHub.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: practice-counts
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: A token for commits to main, from the Nest bot app when it is configured
        id: app
        if: vars.NEST_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.NEST_BOT_APP_ID }}
          private-key: ${{ secrets.NEST_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          # the push at the end uses this token: the app's, which the main ruleset lets through
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: py/pyproject.toml
      - name: Install nest_data
        run: python -m pip install ./py
      - name: Compute counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: nest practice-counts
      - name: Validate the result
        run: nest validate
      - name: Commit and push when something changed
        run: |
          if git diff --quiet -- contributors; then
            echo "No count changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributors/*/.practice.json
          git commit -m "chore: update practice counts"
          git push
