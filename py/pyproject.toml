[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-data"
version = "0.1.0"
description = "Nest's data step: validate contributor and cohort files, write the site data file, run the defect bank"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nest = "nest_data.cli:entry"

[tool.setuptools.packages.find]
include = ["nest_data*"]

[tool.setuptools.package-data]
nest_data = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pycodestyle]
# the formatter wraps code at 110; messages and docstrings may run a little longer rather than be split mid-sentence
max-line-length = 135

[tool.ruff.format]
quote-style = "double"
