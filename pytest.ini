# pytest from the repository root runs nest_data's tests (py/tests) and the python track's own tests in
# contributors/<handle>/test_*.py. Install first: pip install -e "py[dev]" (docs/CONTRIBUTING.md).
[pytest]
testpaths = py/tests contributors
pythonpath = py
addopts = --import-mode=importlib -p no:cacheprovider --ignore=py/tests/fixtures
